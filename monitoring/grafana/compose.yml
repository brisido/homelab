services:
  grafana:
    image: grafana/grafana:${SOFTWARE_VERSION_TAG}
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}

    volumes:
      - grafana_data:/var/lib/grafana

    networks:
      - homelab-net

volumes:
  grafana_data:

networks:
  homelab-net:
    external: true